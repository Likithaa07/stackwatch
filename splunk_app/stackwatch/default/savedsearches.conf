[StackWatch - UNDERSIZED]
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
search = | `stackwatch_status` | where status="UNDERSIZED" | eval severity="high", runbook="https://github.com/Likithaa07/stackwatch/blob/main/docs/runbook.md#undersized"
description = Customer above 90% of planned capacity for 15 min. Follow the runbook link.
alert.severity = 5
alert.suppress.fields = customer_id

[StackWatch - NO DATA]
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
search = | `stackwatch_status` | where status="NO DATA" | eval severity="medium", runbook="https://github.com/Likithaa07/stackwatch/blob/main/docs/runbook.md#no-data"
description = No usage events from a customer for 10+ min.
alert.severity = 3
alert.suppress.fields = customer_id

[StackWatch - stale plans]
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
search = | inputlookup stackwatch_plans | eval age_h=round((now()-planned_at)/3600, 1) | where isnull(planned_at) OR age_h>24 | eval severity="medium", runbook="https://github.com/Likithaa07/stackwatch/blob/main/docs/runbook.md#stale-plans" | table customer_id planned_at age_h severity runbook
description = Sizing plans not refreshed for 24+ hours. Re-run scripts/plan.py.
alert.severity = 3
alert.suppress.fields = customer_id

[StackWatch - plan data quality]
search = | inputlookup stackwatch_plans | where isnull(region) OR region="" OR isnull(planned_capacity_gb) OR planned_capacity_gb<=0 OR isnull(rules_version) OR rules_version="" | eval severity="medium", runbook="https://github.com/Likithaa07/stackwatch/blob/main/docs/runbook.md#plan-data-quality" | table customer_id region planned_capacity_gb rules_version severity runbook
description = A plan is missing a required field (region, capacity or rules version). Found by drill D2.
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = customer_id
alert.severity = 3

[StackWatch - rules mismatch]
search = | inputlookup stackwatch_plans | where isnotnull(rules_version) AND rules_version!=`stackwatch_current_rules` | eval severity="medium", runbook="https://github.com/Likithaa07/stackwatch/blob/main/docs/runbook.md#rules-mismatch" | table customer_id rules_version severity runbook
description = A plan was sized with different SizeRight rules than the current version. Found by drill D4.
enableSched = 1
cron_schedule = */5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 0
alert.track = 1
alert.suppress = 1
alert.suppress.period = 1h
alert.suppress.fields = customer_id
alert.severity = 3
