[stackwatch_thresholds]
definition = eval under_pct=90, under_min=15, over_pct=40, over_min=60, nodata_min=10

[stackwatch_status]
definition = search index=stackwatch sourcetype=stackwatch:usage earliest=-70m \
    | lookup stackwatch_plans customer_id OUTPUT planned_capacity_gb \
    | eval util_pct=round(100*ingest_gb_per_day/planned_capacity_gb, 1), age_min=(now()-_time)/60 \
    | `stackwatch_thresholds` \
    | stats latest(util_pct) as util_pct max(_time) as last_seen min(_time) as first_seen \
        min(eval(if(age_min<=under_min, util_pct, null()))) as low_15 \
        max(eval(if(age_min<=over_min, util_pct, null()))) as high_60 by customer_id \
    | append [| inputlookup stackwatch_plans | fields customer_id] \
    | stats first(*) as * by customer_id \
    | `stackwatch_thresholds` \
    | eval mins_since=round((now()-last_seen)/60, 1), span_min=(now()-first_seen)/60 \
    | eval status=case(isnull(last_seen) OR mins_since>nodata_min, "NO DATA", \
        low_15>under_pct AND span_min>=under_min, "UNDERSIZED", \
        high_60<over_pct AND span_min>=over_min, "OVERSIZED", true(), "OK") \
    | fields customer_id status util_pct low_15 high_60 mins_since

[stackwatch_current_rules]
definition = "v1"
