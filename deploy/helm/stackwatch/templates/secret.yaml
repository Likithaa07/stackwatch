apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword is required (scripts/k8s-up.sh sets it)" .Values.secrets.dbPassword | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  hec-token: {{ required "secrets.hecToken is required" .Values.secrets.hecToken | quote }}
