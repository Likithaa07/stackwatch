apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - {name: POSTGRES_USER, value: sizer}
            - {name: POSTGRES_DB, value: sizer}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-secrets, key: db-password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "sizer"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "sizer"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.medium | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}  # local dev only: data resets with the pod
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
