{{- $stale := mul (int .Values.simulator.interval) 3 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-simulator
spec:
  replicas: 1
  selector:
    matchLabels: {app: simulator}
  template:
    metadata:
      labels: {app: simulator}
    spec:
      containers:
        - name: simulator
          image: {{ .Values.images.simulator }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - {name: HEC_URL, value: {{ .Values.simulator.hecUrl | quote }}}
            - name: HEC_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Release.Name }}-secrets, key: hec-token}}
            - {name: HEC_INSECURE, value: {{ .Values.simulator.hecInsecure | quote }}}
            - {name: SIM_INTERVAL, value: {{ .Values.simulator.interval | quote }}}
            - {name: SIM_SPEED, value: {{ .Values.simulator.speed | quote }}}
          # Worker with no port: healthy = heartbeat file touched within 3 intervals.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > {{ $stale }})"]
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/heartbeat"]}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}
